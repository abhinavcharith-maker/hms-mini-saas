services:
  postgres:
    image: postgres:16-alpine
    container_name: verdantcare_hms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hms_user
      POSTGRES_PASSWORD: change_me_in_production
      POSTGRES_DB: hms_mini_saas
    ports:
      - "5432:5432"
    volumes:
      - hms_pgdata:/var/lib/postgresql/data

volumes:
  hms_pgdata:
